<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Calculadora de Notas</h1>
        <p>Ingrese sus tres notas para calcular el promedio final.</p>
        
        <form id="formularioNotas">
            <label for="notaUno">Nota 1:</label>
            <input type="number" id="notaUno" name="notaUno" placeholder="Ej: 5.5" min="1" max="7" step="0.1" required>
            
            <label for="notaDos">Nota 2:</label>
            <input type="number" id="notaDos" name="notaDos" placeholder="Ej: 4.0" min="1" max="7" step="0.1" required>
            
            <label for="notaTres">Nota 3:</label>
            <input type="number" id="notaTres" name="notaTres" placeholder="Ej: 6.2" min="1" max="7" step="0.1" required>
            
            <button type="submit">Calcular Promedio</button>
        </form>
        
        <section id="resultado" class="resultado" style="display: none;">
            Aquí aparecerá el promedio.
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
